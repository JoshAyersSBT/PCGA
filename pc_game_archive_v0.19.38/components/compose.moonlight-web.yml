services:
  moonlight-web:
    image: mrcreativ3001/moonlight-web-stream:v3.0.0-prerelease.6
    container_name: pcga-moonlight-web
    network_mode: host
    environment:
      BIND_ADDRESS: "0.0.0.0:${PCGA_MOONLIGHT_WEB_PORT:-8101}"
      SSL_PRIVATE_KEY: "/pcga-tls/pcga-server.key"
      SSL_CERTIFICATE: "/pcga-tls/pcga-server.crt"
      WEBRTC_PORT_RANGE: "40000:40099"
      WEBRTC_NAT_1TO1_HOST: "${PCGA_LAN_IP}"
    volumes:
      - pcga-moonlight-web:/moonlight-web/server
      - /etc/pc-game-archive/tls:/pcga-tls:ro
    restart: unless-stopped

  moonlight-web-2:
    image: mrcreativ3001/moonlight-web-stream:v3.0.0-prerelease.6
    container_name: pcga-moonlight-web-2
    network_mode: host
    environment:
      BIND_ADDRESS: "0.0.0.0:${PCGA_MOONLIGHT_WEB_PORT_2:-8102}"
      SSL_PRIVATE_KEY: "/pcga-tls/pcga-server.key"
      SSL_CERTIFICATE: "/pcga-tls/pcga-server.crt"
      WEBRTC_PORT_RANGE: "40100:40199"
      WEBRTC_NAT_1TO1_HOST: "${PCGA_LAN_IP}"
    volumes:
      - pcga-moonlight-web-2:/moonlight-web/server
      - /etc/pc-game-archive/tls:/pcga-tls:ro
    restart: unless-stopped

  moonlight-web-3:
    image: mrcreativ3001/moonlight-web-stream:v3.0.0-prerelease.6
    container_name: pcga-moonlight-web-3
    network_mode: host
    environment:
      BIND_ADDRESS: "0.0.0.0:${PCGA_MOONLIGHT_WEB_PORT_3:-8103}"
      SSL_PRIVATE_KEY: "/pcga-tls/pcga-server.key"
      SSL_CERTIFICATE: "/pcga-tls/pcga-server.crt"
      WEBRTC_PORT_RANGE: "40200:40299"
      WEBRTC_NAT_1TO1_HOST: "${PCGA_LAN_IP}"
    volumes:
      - pcga-moonlight-web-3:/moonlight-web/server
      - /etc/pc-game-archive/tls:/pcga-tls:ro
    restart: unless-stopped

  moonlight-web-4:
    image: mrcreativ3001/moonlight-web-stream:v3.0.0-prerelease.6
    container_name: pcga-moonlight-web-4
    network_mode: host
    environment:
      BIND_ADDRESS: "0.0.0.0:${PCGA_MOONLIGHT_WEB_PORT_4:-8104}"
      SSL_PRIVATE_KEY: "/pcga-tls/pcga-server.key"
      SSL_CERTIFICATE: "/pcga-tls/pcga-server.crt"
      WEBRTC_PORT_RANGE: "40300:40399"
      WEBRTC_NAT_1TO1_HOST: "${PCGA_LAN_IP}"
    volumes:
      - pcga-moonlight-web-4:/moonlight-web/server
      - /etc/pc-game-archive/tls:/pcga-tls:ro
    restart: unless-stopped

volumes:
  pcga-moonlight-web:
  pcga-moonlight-web-2:
  pcga-moonlight-web-3:
  pcga-moonlight-web-4:
